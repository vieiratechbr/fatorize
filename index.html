<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Fatorize</title>
</head>
<body>

  <div id="loader-overlay" class="loader-overlay hidden">
    <div class="book" id="book">
      <div class="book__pg-shadow"></div>
      <div class="book__pg"></div>
      <div class="book__pg book__pg--2"></div>
      <div class="book__pg book__pg--3"></div>
      <div class="book__pg book__pg--4"></div>
      <div class="book__pg book__pg--5"></div>
    </div>
  </div>

  <header class="header">
    <div class="logo-group">
      <span class="simbolo-raiz">√</span>
      <h1 class="logo-texto">Fatorize</h1>
      <span class="subtitulo">Sua calculadora de fatores</span>
    </div>
    <nav class="menu">
      <a href="comousar.html" class="link1">COMO USAR</a>
      <a href="#como-usar" class="link3">SUPORTE</a>
      <a href="#como-usar" class="link4">DOAR</a>
    </nav>
  </header>

  <div class="calculos">
    <div class="inteiros">
        <h2><img src="cubes.png" alt="Ícone de Números Inteiros"> Números Inteiros</h2>
        <input type="text" id="input-inteiros" placeholder="Digite um número inteiro">
        <button id="calcular-inteiros">Fatorar Número</button>
    </div>
    <div class="polinômios">
        <h2><img src="polynomial.png" alt="Ícone de Polinômios">Polinômios</h2>
        <input type="text" id="input-polinomios" placeholder="Digite um polinômio">
        <div class="teclado-atalhos">
            <button type="button" onclick="inserirSimbolo('x')">x</button>
            <button type="button" onclick="inserirSimbolo('^')">^</button>
            <button type="button" onclick="inserirSimbolo('+')">+</button>
            <button type="button" onclick="inserirSimbolo('-')">-</button>
            <button type="button" onclick="inserirSimbolo('(')">(</button>
            <button type="button" onclick="inserirSimbolo(')')">)</button>
        </div>
        <button id="calcular-polinomios">Fatorar Polinômio</button>
    </div>
  </div>

  <div class="resultados">
    <div class="resultadobox"><h2>Resultado</h2></div>
  </div>
  
  <footer class="footer">
    <div class="github-box">
      <p>Gostou do projeto? Avalie no GitHub!</p>
      <a href="https://github.com/vieiratechbr/fatorize" target="_blank" class="github-btn">⭐ Star no GitHub</a>
    </div>
    <p class="copyright">© 2026 Fatorize. Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
